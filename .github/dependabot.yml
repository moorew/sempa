version: 2
updates:
  # Go backend
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days before opening update PRs, so a malicious or broken release
    # has time to be yanked before it reaches us (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # SvelteKit / Tauri / Capacitor frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days before opening update PRs, so a malicious or broken release
    # has time to be yanked before it reaches us (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # Tauri (Rust) desktop shell
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days before opening update PRs, so a malicious or broken release
    # has time to be yanked before it reaches us (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      cargo-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # glib < 0.20 (RUSTSEC-2024-0429) is a transitive, Linux-only dep of Tauri's
      # gtk-rs 0.18 stack (via gio-sys/gdk). Tauri 2.x caps it at 0.18.5, so the
      # 0.20.0 fix is unreachable and the security-update job fails on every run.
      # (We DO ship Linux desktop builds now — AppImage/deb/rpm/Flatpak — so this
      # code IS in those artifacts; the ignore is here because the fix is
      # unreachable, not because the code is absent.) Revisit when Tauri moves to
      # gtk-rs 0.20. Same applies to the rest of the capped gtk stack.
      - dependency-name: "glib"
      - dependency-name: "gdk"
      - dependency-name: "gdk-sys"
      - dependency-name: "gtk"
      - dependency-name: "gtk-sys"
      - dependency-name: "gio"
      - dependency-name: "gio-sys"
      - dependency-name: "glib-sys"
      - dependency-name: "atk"
      - dependency-name: "pango"

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days before opening update PRs, so a malicious or broken release
    # has time to be yanked before it reaches us (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      # One PR for ALL action bumps, majors included — deliberately unfiltered,
      # unlike the other ecosystems. Actions from the same repo must move in
      # lockstep: github/codeql-action/init and .../analyze arrived as separate
      # PRs and each failed on its own with "Loaded a configuration file for
      # version X, but running version Y", because neither could pass without
      # the other. Grouping is what makes them mergeable.
      actions:
        patterns: ["*"]

  # Base image in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a few days before opening update PRs, so a malicious or broken release
    # has time to be yanked before it reaches us (supply-chain hygiene).
    cooldown:
      default-days: 7
