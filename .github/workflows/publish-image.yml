name: Publish image

# Build and publish the server image to the GitHub Container Registry on each
# release tag, so self-hosters can `docker pull` a prebuilt image instead of
# building from source. Decoupled from the deploy (which still builds locally)
# and from the desktop/mobile release builds — a failure here breaks neither.
# Third-party actions are pinned to commit SHAs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # Successful runs finish in ~8 min; the emulated arm64 build can intermittently
    # stall under QEMU (it once hung ~2h before being cancelled). Fail fast instead
    # so a stuck build is obvious and re-runnable rather than churning for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
