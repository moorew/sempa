name: Publish image

# Build and publish the server image to the GitHub Container Registry on each
# release tag, so self-hosters can `docker pull` a prebuilt image instead of
# building from source. Decoupled from the deploy (which still builds locally)
# and from the desktop/mobile release builds — a failure here breaks neither.
# Third-party actions are pinned to commit SHAs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # Successful runs finish in ~8 min; the emulated arm64 build can intermittently
    # stall under QEMU (it once hung ~2h before being cancelled). Fail fast instead
    # so a stuck build is obvious and re-runnable rather than churning for hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
