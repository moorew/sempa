name: Tag release

# Cuts a release tag automatically when the version in frontend/package.json is
# bumped on main. A tag is created only when there's no matching v<version> tag
# yet, so ordinary docs/CI merges don't trigger a release — bump the version to
# ship one. The tag then kicks off the Windows, Linux, Android, iOS + image builds,
# which each cut the GitHub Release and upload their artifacts.
#
# The tag is pushed with git. Tags pushed with a PAT (RELEASE_PAT) DO trigger the
# `on: push: tags` release workflows (a plain GITHUB_TOKEN push does NOT — GitHub
# blocks that to prevent loops). So:
#   • RELEASE_PAT set  → push the tag → every release workflow runs ON THE TAG and
#     creates the Release automatically. Nothing else needed.
#   • RELEASE_PAT unset → fall back to creating the tag with the built-in token and
#     dispatching the builds by ref (artifacts build, but the Release isn't cut —
#     push the tag manually to finish). No worse than before; add the PAT to fix.

on:
  push:
    branches: [main]

# Read-only by default; the job below widens to exactly what it needs.
permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/push the tag ref
      actions: write    # dispatch the release workflows (fallback path)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist a PAT when available so a `git push` of the tag triggers the
          # release workflows; otherwise the built-in token (push works, but the
          # tag-triggered workflows won't fire — handled by the fallback below).
          token: ${{ secrets.RELEASE_PAT || github.token }}
          persist-credentials: true

      - name: Read version from package.json
        id: ver
        run: echo "v=v$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"

      - name: Tag the version (auto-releases when RELEASE_PAT is set)
        env:
          V: ${{ steps.ver.outputs.v }}
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$V" >/dev/null 2>&1; then
            echo "Tag $V already exists — nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$V" "$GITHUB_SHA"
          git push origin "refs/tags/$V"
          echo "Pushed tag $V at $GITHUB_SHA"

          if [ "$HAS_PAT" = "true" ]; then
            echo "RELEASE_PAT present — the tag push will trigger the release workflows; they cut the GitHub Release automatically."
          else
            echo "::warning::RELEASE_PAT not set — a GITHUB_TOKEN tag push does not trigger workflows. Dispatching builds by ref (artifacts only; the GitHub Release is NOT cut). Add a RELEASE_PAT secret to fully automate releases."
            gh workflow run windows-release.yml --ref "$V" || true
            gh workflow run linux-release.yml --ref "$V" || true
            gh workflow run android-release.yml --ref "$V" || true
            gh workflow run ios-release.yml --ref "$V" || true
            gh workflow run publish-image.yml --ref "$V" || true
          fi
