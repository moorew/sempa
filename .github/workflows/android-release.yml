name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; the build job widens to publish the release.
permissions:
  contents: read

jobs:
  build:
    name: Build & Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
      # (signing moved to the Release finalize workflow — no id-token needed here)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No npm cache: this workflow runs only on tags/workflow_dispatch and
          # publishes release artifacts, so restoring a cache is an unnecessary
          # cache-poisoning vector (flagged by zizmor) for little speed gain.

      - name: Setup JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Write google-services.json
        working-directory: frontend/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json

      - name: Decode release keystore
        working-directory: frontend/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          echo "Keystore size: $(wc -c < release.keystore) bytes"

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build signed APK and AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease   # APK only; the Play-Store .aab isn't published

      # Release signing is centralized in the `Release finalize` workflow (one
      # signed SHA256SUMS for the whole release), not per-artifact here.

      # Pull the human-written summary for this version out of CHANGELOG.md so the
      # GitHub Release leads with it (generate_release_notes appends the auto
      # contributor/compare list below). REF_NAME via env, never interpolated into
      # the script body (zizmor).
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver="${REF_NAME#v}"
          notes="$(awk -v v="$ver" '
            index($0, "## [" v "]") == 1 {cap=1; next}
            cap && /^## \[/ {exit}
            cap {print}
          ' CHANGELOG.md)"
          notes="$(printf '%s\n' "$notes" | sed -e 's/[[:space:]]*$//')"
          [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ] && notes="See CHANGELOG.md for details."
          { printf '## Sempa %s\n\n' "$REF_NAME"; printf '%s\n' "$notes"; } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sempa-android
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
