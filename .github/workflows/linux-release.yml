name: Linux Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'frontend/**'
      - 'sempa-linux/**'
      - '.github/workflows/linux-release.yml'
  workflow_dispatch:

# Read-only by default; the build job widens to publish the release.
permissions:
  contents: read

jobs:
  build:
    name: Build Linux (${{ matrix.arch }} · deb/rpm/AppImage)
    runs-on: ${{ matrix.runner }}
    # x86_64 + aarch64. aarch64 builds natively on GitHub's free arm64 runners
    # (public repo). The aarch64 artifacts double as the base for the Sempa Dock.
    # fail-fast off so one arch failing still uploads the other.
    #
    # GLIBC FLOOR: build on ubuntu-22.04 (glibc 2.35), NOT 24.04 (glibc 2.39).
    # AppImages bundle app libs but NOT glibc, so a binary built against 2.39
    # fails to even start on any older distro (Ubuntu 22.04, Debian 12, Mint 21,
    # Zorin 17, …) — the dynamic loader bails before main(). 22.04 is the oldest
    # base with webkit2gtk-4.1, giving the widest reach.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, debarch: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, debarch: arm64 }
    permissions:
      contents: write   # attach bundles to the GitHub Release on tags

    # Updater signing — SAFE no-op until the maintainer adds the keypair secret
    # AND sets bundle.createUpdaterArtifacts (see docs/UPDATER.md). Until then this
    # builds plain deb/rpm/AppImage exactly as a local `tauri build` would; the
    # .sig globs below simply match nothing.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # AppImage tooling (linuxdeploy + appimagetool) ships as AppImages that
      # mount via FUSE 2; runners lack it, so they self-extract instead.
      # NO_STRIP avoids a linuxdeploy strip step that trips on the runner toolchain.
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
      # WebKitGTK software-render path for the headless smoke test (no GPU in CI).
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
      LIBGL_ALWAYS_SOFTWARE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Tauri's Linux prerequisites. webkit2gtk-4.1 is the WebKitGTK the Linux
      # webview links against; the appindicator + rsvg + soup packages cover the
      # tray (StatusNotifierItem) and SVG icon rendering.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            desktop-file-utils \
            appstream \
            libfuse2 \
            xdg-utils \
            xvfb \
            dbus-x11

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: linux-cargo-${{ matrix.arch }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-${{ matrix.arch }}-

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Clean stale bundle artifacts
        # The Rust cache uses a restore-keys prefix fallback, so a build can
        # restore a PREVIOUS build's target/ — including its bundle/ output. Tauri
        # writes new version-named artifacts but never deletes old ones, so the
        # upload globs below would grab stale wrong-version deb/rpm/AppImage (this
        # shipped 1.2.0 bundles into the 1.2.1 release once). Wipe bundle/ first.
        run: rm -rf frontend/src-tauri/target/release/bundle

      - name: Build Tauri app (deb/rpm/AppImage)
        working-directory: frontend
        # --verbose surfaces linuxdeploy/appimagetool stderr (Tauri otherwise
        # swallows it behind "failed to run linuxdeploy").
        run: npx tauri build --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Validate the desktop integration files the bundler emitted (identity).
      - name: Validate desktop entry + AppStream
        run: |
          desktop-file-validate sempa-linux/desktop/ca.sempa.Sempa.desktop
          appstreamcli validate sempa-linux/desktop/ca.sempa.Sempa.metainfo.xml

      # Smoke test: actually LAUNCH the built AppImage headlessly on this runner's
      # glibc. Catches "doesn't start" regressions (missing libs, too-new glibc,
      # plugin init panics) that a compile-only build can't — exactly the class of
      # bug that shipped a 24.04-built binary that wouldn't run on 22.04.
      - name: Smoke test (app launches)
        run: |
          APP=$(ls frontend/src-tauri/target/release/bundle/appimage/Sempa_*.AppImage | head -1)
          chmod +x "$APP"
          rm -f /tmp/sempa-startup.log
          # Run for 30s under a virtual display + private session bus, then stop.
          xvfb-run -a dbus-run-session -- timeout 30 "$APP" || true
          echo '----- sempa-startup.log -----'; cat /tmp/sempa-startup.log 2>/dev/null || true
          if [ ! -f /tmp/sempa-startup.log ]; then
            echo '::error::no startup log — the app never started (loader/glibc failure?)'; exit 1
          fi
          if ! grep -q 'setup: complete' /tmp/sempa-startup.log; then
            echo '::error::app started but never reached "setup: complete"'; exit 1
          fi
          if grep -qE 'PANIC|FATAL' /tmp/sempa-startup.log; then
            echo '::error::startup panic/fatal in the log'; exit 1
          fi
          echo 'smoke test OK — app launched and completed setup'

      - name: Upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sempa-linux-${{ matrix.arch }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

      - name: Attach to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          # .sig globs are future-ready: empty until createUpdaterArtifacts + the
          # signing key are enabled (docs/UPDATER.md), then they carry the AppImage
          # updater signatures. softprops ignores globs that match nothing.
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
