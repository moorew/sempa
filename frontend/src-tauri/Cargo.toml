[package]
name = "sempa"
version = "1.8.1"
edition = "2021"
description = "sempa — calm, local-first task management"

[lib]
name = "sempa_lib"
# Desktop-only Tauri app (Android ships via Capacitor, not Tauri mobile), so the
# iOS-only `staticlib` crate-type is omitted — it produced a ~600 MB archive on
# every build for no benefit. `cdylib` keeps the Tauri mobile entry point valid.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

# Single-instance is desktop-only (no mobile target). The deep-link feature makes
# a second launch forward its sempa:// URL / argv to the already-running instance.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS secret store for the bearer token: Secret Service (libsecret) on Linux,
# Credential Manager on Windows, Keychain on macOS. The per-OS backend crates are
# target-gated inside `keyring`, so enabling all three native features is safe.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Global quick-add shortcut (desktop). On Wayland this needs the GlobalShortcuts
# portal, which the plugin may not broker yet — registration is best-effort.
tauri-plugin-global-shortcut = "2"

# Linux only: read the system window-button layout (gtk-decoration-layout) so the
# custom titlebar mirrors GNOME/KDE order + side. Version matches the gtk already
# in the wry/tao dependency tree (0.18) to avoid a duplicate gtk build.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
